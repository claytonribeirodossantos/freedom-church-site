backend:
  name: github
  repo: claytonribeirodossantos/freedom-church-site
  branch: main
  base_url: https://freedom-church-site.claytonribeirodossantos.workers.dev
  auth_endpoint: /api/auth

publish_mode: editorial_workflow

media_folder: "site/public/uploads"
public_folder: "/uploads"

site_url: https://freedom-church-site.claytonribeirodossantos.workers.dev
display_url: https://freedom-church-site.claytonribeirodossantos.workers.dev
logo_url: https://freedom-church-site.claytonribeirodossantos.workers.dev/logo.png

locale: pt

collections:
  - name: sermons
    label: "Pregações"
    label_singular: "Pregação"
    folder: "site/src/content/sermons"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "Em destaque"
        field: featured
        pattern: true
    fields:
      - { label: "Título (PT)", name: title, widget: string }
      - { label: "Título (EN)", name: titleEn, widget: string, required: false }
      - { label: "Título (ES)", name: titleEs, widget: string, required: false }
      - { label: "Série", name: series, widget: string, hint: "Ex: Liberdade, Família, Identidade" }
      - { label: "Pastor", name: pastor, widget: string, hint: "Ex: Pr Adaelton de Souza" }
      - { label: "Data", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Duração", name: duration, widget: string, hint: "Ex: 38 min" }
      - { label: "YouTube ID", name: youtubeId, widget: string, hint: "Só o ID, ex: vPoRJh9AWZk (não a URL completa)" }
      - { label: "Em destaque na Home?", name: featured, widget: boolean, default: false }
      - { label: "Descrição (PT)", name: description, widget: text, required: false }
      - { label: "Descrição (EN)", name: descriptionEn, widget: text, required: false }
      - { label: "Descrição (ES)", name: descriptionEs, widget: text, required: false }
      - { label: "Corpo (notas, transcrição)", name: body, widget: markdown, required: false }

  - name: events
    label: "Eventos"
    label_singular: "Evento"
    folder: "site/src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título (PT)", name: title, widget: string }
      - { label: "Título (EN)", name: titleEn, widget: string, required: false }
      - { label: "Título (ES)", name: titleEs, widget: string, required: false }
      - label: "Tag"
        name: tag
        widget: select
        options: ["Conferência", "Comunhão", "Jovens", "Missão", "Família", "Casais", "Mulheres", "Homens", "Kids", "Batismo"]
      - { label: "Data", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Hora", name: time, widget: string, hint: "Ex: 19h00 ou Sex–Dom" }
      - { label: "Local", name: place, widget: string }
      - { label: "Descrição (PT)", name: description, widget: text }
      - { label: "Descrição (EN)", name: descriptionEn, widget: text, required: false }
      - { label: "Descrição (ES)", name: descriptionEs, widget: text, required: false }
      - { label: "Capa (opcional)", name: cover, widget: image, required: false }
      - { label: "Corpo", name: body, widget: markdown, required: false }

  - name: blog
    label: "Blog / Devocional"
    label_singular: "Post"
    folder: "site/src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título (PT)", name: title, widget: string }
      - { label: "Título (EN)", name: titleEn, widget: string, required: false }
      - { label: "Título (ES)", name: titleEs, widget: string, required: false }
      - { label: "Autor", name: author, widget: string }
      - { label: "Data", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Resumo (PT)", name: excerpt, widget: text }
      - { label: "Resumo (EN)", name: excerptEn, widget: text, required: false }
      - { label: "Resumo (ES)", name: excerptEs, widget: text, required: false }
      - { label: "Capa (opcional)", name: cover, widget: image, required: false }
      - { label: "Tags", name: tags, widget: list, default: [], required: false }
      - { label: "Conteúdo", name: body, widget: markdown }
